<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="logo_alegria_y_folclor.png" alt="Logo">
            <h1>Alegría y Folclor</h1>
        </a>
        <button class="menu-toggle" id="mobile-menu-btn"><span></span><span></span><span></span></button>
        <nav id="nav-links">
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>

    </header>

    <div class="container" data-aos="flip-left" data-aos-duration="1000">
        <h3 class="seccion-titulo">Contrataciones y Gestión</h3>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Institución o Contacto Directo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Nombre de la entidad">
            </div>
            <div class="form-group">
                <label for="correo">Dirección de Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@dominio.com">
            </div>
            <div class="form-group">
                <label for="mensaje">Detalles del Requerimiento Artístico</label>
                <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escriba los pormenores de la gala..."></textarea>
            </div>
            <button type="submit">Enviar Solicitud Corporativa</button>
        </form>
    </div>

    <footer>
        <h4>Alegría y Folclor</h4>
        <p class="footer-lema">"Bailando con el corazón"</p>
        <p>&copy; 2026 Alegría y Folclor. Alta Proyección Folclórica.</p>
