<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alegría y Folclor | Bienvenidos</title>
    
    <!-- Conexión con Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-verde-oscuro: #0A291B; 
            --color-verde-acento: #0D5C3A;
            --color-fondo: #F5F7F6;        
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-fondo);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            -webkit-tap-highlight-color: transparent; /* Elimina el cuadro azul feo al tocar en celulares */
        }

        body.fade-in {
            opacity: 1;
        }

        /* Contenedor del botón táctil y clicable */
        .logo-welcome-container {
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
        }

        /* Ajuste perfecto y responsivo del Logotipo PNG */
        .logo-welcome-container img {
            width: 260px; 
            height: 260px;
            max-width: 80vw; /* Evita que en pantallas de celulares muy pequeños el logo se salga */
            max-height: 80vw;
            object-fit: cover; 
            border-radius: 50%;
            border: 3px solid var(--color-verde-acento);
            padding: 6px;
            background-color: #FFFFFF;
            box-shadow: 0 20px 40px rgba(10, 41, 27, 0.12);
            animation: respirarLogo 4s ease-in-out infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Texto de invitación elegante */
        .enter-text {
            margin-top: 2.5rem; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--color-verde-oscuro);
            opacity: 0.6;
            transition: all 0.4s ease;
        }

        /* Animación suave de flotación */
        @keyframes respirarLogo {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        /* Efectos visuales para PC */
        @media (min-width: 769px) {
            .logo-welcome-container:hover img {
                transform: scale(1.03);
                box-shadow: 0 25px 50px rgba(13, 92, 58, 0.2);
            }
            .logo-welcome-container:hover .enter-text {
                opacity: 1;
                letter-spacing: 7px;
                color: var(--color-verde-acento);
            }
        }

        /* Desvanecimiento de salida fluido */
        body.fade-out {
            opacity: 0;
            transform: scale(0.97);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- Elemento de Audio Oculto -->
    <audio id="welcome-audio" src="viento_andino.mp3" preload="auto"></audio>

    <div class="logo-welcome-container" id="enter-site-btn">
        <img src="logo_alegria_y_folclor.png" alt="Logotipo Oficial Alegría y Folclor">
        <div class="enter-text">Entrar al sitio</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Muestra la pantalla suavemente
            setTimeout(() => {
                document.body.classList.add("fade-in");
            }, 50);

            const enterBtn = document.getElementById("enter-site-btn");
            const audioEfecto = document.getElementById("welcome-audio");
            let yaHizoClic = false; // Evita que se presione dos veces seguidas

            // Función unificada para avanzar de página de forma segura
            function entrarAlSitio() {
                if (yaHizoClic) return;
                yaHizoClic = true;

                // 1. Intentar reproducir audio con un sistema "salvavidas"
                if (audioEfecto) {
                    audioEfecto.volume = 0.4;
                    // El truco secreto: si el celular frena el sonido, el .catch lo atrapa y no traba la pantalla
                    audioEfecto.play().catch(error => {
                        console.log("Audio omitido de forma segura en celular:", error);
                    });
                }

                // 2. Ejecutar desvanecimiento visual
                document.body.classList.add("fade-out");
                
                // 3. Redirección garantizada a los 400 milisegundos (funciona sí o sí)
                setTimeout(() => {
                    window.location.href = "inicio.html";
                }, 400);
            }

            // Detecta tanto el clic de mouse (PC) como el toque de dedo (Pantallas táctiles / Celulares)
            enterBtn.addEventListener("click", entrarAlSitio);
            enterBtn.addEventListener("touchstart", (e) => {
                e.preventDefault(); // Evita clics dobles fantasmas en celulares
                entrarAlSitio();
            });
        });
    </script>

</body>
</html>
