<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alegría y Folclor | Bienvenidos</title>
    <style>
        :root {
            --color-verde-oscuro: #0A291B; 
            --color-verde-acento: #0D5C3A;
            --color-fondo: #F5F7F6;        
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-fondo);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        body.fade-in {
            opacity: 1;
        }

        .logo-welcome-container {
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Control perfecto y redondo para la imagen PNG */
        .logo-welcome-container img {
            width: 280px; 
            height: 280px;
            object-fit: cover; /* Mantiene la proporción perfecta del logo circular */
            border-radius: 50%;
            border: 3px solid var(--color-verde-acento);
            padding: 6px;
            background-color: #FFFFFF;
            box-shadow: 0 20px 50px rgba(10, 41, 27, 0.12);
            animation: respirarLogo 4s ease-in-out infinite;
            transition: all 0.5s ease;
        }

        .logo-welcome-container:hover img {
            transform: scale(1.03);
            box-shadow: 0 25px 60px rgba(13, 92, 58, 0.2);
        }

        .enter-text {
            margin-top: 3rem; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--color-verde-oscuro);
            opacity: 0.6;
            transition: all 0.4s ease;
        }

        .logo-welcome-container:hover .enter-text {
            opacity: 1;
            letter-spacing: 6px;
            color: var(--color-verde-acento);
        }

        @keyframes respirarLogo {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        body.fade-out {
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }
    </style>
</head>
<body>

    <audio id="welcome-audio" src="viento_andino.mp3" preload="auto"></audio>

    <div class="logo-welcome-container" id="enter-site-btn">
        <!-- Cambiado oficialmente a .png para solucionar el problema -->
        <img src="logo_alegria_y_folclor.png" alt="Logotipo Oficial Alegría y Folclor">
        <div class="enter-text">Entrar al sitio</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.body.classList.add("fade-in");
            }, 50);

            const enterBtn = document.getElementById("enter-site-btn");
            const audioEfecto = document.getElementById("welcome-audio");
            
            enterBtn.addEventListener("click", () => {
                if(audioEfecto) {
                    audioEfecto.volume = 0.5;
                    audioEfecto.play().catch(error => {
                        console.log("Audio bloqueado:", error);
                    });
                }
                document.body.classList.add("fade-out");
                setTimeout(() => {
                    window.location.href = "inicio.html";
                }, 600);
            });
        });
    </script>

</body>
</html>
